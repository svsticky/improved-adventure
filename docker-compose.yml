services:
  keycloak:
    build: .
    command: start-dev
    environment:
      KC_DB: keycloak
      KC_DB_URL: ${DB_URL}
      KC_DB_USERNAME: ${DB_USERNAME}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: true

      KEYCLOAK_ADMIN: dev@svsticky.nl
      KEYCLOAK_ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      KC_FEATURES: update-email

      KC_THEME_WELCOME_CACHE: "false"
      KC_THEME_CACHE_THEMES: "false"
      KC_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_LOGIN_NAME: main-theme
      KC_SPI_THEME_EMAIL_NAME: main-theme
      KC_SPI_THEME_ACCOUNT_NAME: main-theme

    volumes:
      - ../realms/base:/opt/keycloak/data/import
      - ./themes:/opt/keycloak/themes
      - ./keycloak-bcrypt-1.6.0.jar:/opt/keycloak/providers/keycloak-bcrypt.jar
      - ./providers:/opt/keycloak/providers

    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"

volumes:
  postgres_data:

